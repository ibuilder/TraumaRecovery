<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A comprehensive guide to understanding and healing from trauma, written for everyday people seeking practical, compassionate support on their healing journey."
    />
    <meta
      name="keywords"
      content="trauma recovery, healing, mental health, CBT, DBT, ACT, addiction recovery, childhood trauma, relationship trauma"
    />
    <meta
      property="og:title"
      content="Healing Together - A Practical Guide to Trauma Recovery"
    />
    <meta
      property="og:description"
      content="A comprehensive guide to understanding and healing from trauma for ordinary people."
    />
    <meta property="og:type" content="book" />
    <meta property="og:site_name" content="Healing Together" />
    <meta name="author" content="Matthew M. Emma" />

    <!--
      The share card. These four have to carry an absolute URL: Vite rewrites
      `href` and `src` for the base path but not `content`, and the Open Graph
      spec wants a full URL regardless — a crawler does not resolve a relative
      one against the page it found it on. That hardcodes the deployment host
      here, which is the price of the link unfurling as a book rather than as a
      line of grey text. `check:pages` asserts the image is actually in the
      build, so a rename cannot silently break the card.
    -->
    <meta property="og:url" content="https://ibuilder.github.io/TraumaRecovery/" />
    <meta
      property="og:image"
      content="https://ibuilder.github.io/TraumaRecovery/social-card.png"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Healing Together — A Practical Guide to Trauma Recovery for Ordinary People, by Matthew M. Emma. Free to read, free to download."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Healing Together - A Practical Guide to Trauma Recovery"
    />
    <meta
      name="twitter:description"
      content="A comprehensive guide to understanding and healing from trauma for ordinary people."
    />
    <meta
      name="twitter:image"
      content="https://ibuilder.github.io/TraumaRecovery/social-card.png"
    />
    <meta name="theme-color" content="#2a5c8f" />
    <title>Healing Together - Trauma Recovery Guide</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Open Sans is served from this origin; see the @font-face block in
         index.css. It used to come from Google, which cost two extra
         connections before the first paint and told a third party which
         chapter of a trauma-recovery book each reader had opened. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
