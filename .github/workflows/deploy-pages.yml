name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate book content
        run: npm run validate:content

      - name: Build static site
        # A project site is served from /<repo>/; a user/org site from /.
        run: npm run build:pages
        env:
          VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}

      # A base-path mistake here is silent and total: the build succeeds, the
      # HTML is valid, and the deployed site is a blank page because the browser
      # asks the origin for a path Pages does not serve. Fail before deploying.
      - name: Check the build is servable
        run: npm run check:pages
        env:
          VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}

      # `enablement` is not cosmetic. GitHub Pages was set to "Deploy from a
      # branch", which meant every push to main ran two deployments: this
      # workflow, uploading dist/public, and GitHub's built-in Jekyll build,
      # publishing the repository root. They raced, Jekyll finished last, and
      # the live site was a render of README.md instead of the book. This asks
      # the API to set the build type to `workflow`, which is the setting that
      # stops the Jekyll build being started at all.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `check:pages` proves the build is right. It cannot prove the build is
      # what got published -- and for a while those were different things, with
      # every workflow green while the live URL served something else entirely.
      # The only symptom was a reader saying the book was gone. This is the step
      # that makes that a red build instead of a message.
      - name: Check the deployed site is the book
        run: npx tsx script/check-deployed-site.ts "${{ steps.deployment.outputs.page_url }}"

      # Whether the book *stays* live comes down to one repository setting, and
      # nothing else in a green run reveals it. With Pages set to "Deploy from a
      # branch", GitHub runs its own Jekyll build of the repository root on every
      # push as well as this workflow, and whichever deployment finishes last
      # wins. This workflow can publish the book, pass the check above, and still
      # be overwritten seconds later -- which is exactly what happened, twice,
      # with different winners. The check above sees a snapshot; this sees the
      # cause. It runs after the deploy so a wrong setting reports the problem
      # rather than withholding the site.
      - name: Check Pages deploys from this workflow, not a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
            | jq -r '.build_type // "unknown"')
          echo "Pages build type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages source is \"$build_type\", not \"workflow\". GitHub's built-in Jekyll build is still publishing the repository root over this deployment, and whichever finishes last wins, so the live site is a coin flip. Fix it at Settings -> Pages -> Build and deployment -> Source -> GitHub Actions."
            exit 1
          fi
