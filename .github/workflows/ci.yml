name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, validate content, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Validate book content
        run: npm run validate:content

      - name: Build static site
        run: npm run build:pages

  test:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The tests run against a real production build served the way Pages
      # serves it, base path and 404 fallback included.
      - name: Build static site
        run: npm run build:pages
        env:
          VITE_BASE_PATH: /traumarecovery/

      - name: Run tests
        run: npm test

      # The ebook comes from the same chapter markdown and the same rendered
      # figures, so a change that breaks it breaks it here rather than at upload.
      - name: Build and preflight the EPUB
        run: |
          npm run epub
          npm run check:epub

      - uses: actions/upload-artifact@v4
        with:
          name: healing-together-epub
          path: dist/healing-together.epub
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
