name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, validate content, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lint and format first: they are the cheapest signal in this job by two
      # orders of magnitude, so a bad push fails in seconds rather than after
      # a full build. The lint config exists to keep the accessibility
      # invariants from regressing -- see eslint.config.js for which and why.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Validate book content
        run: npm run validate:content

      - name: Build static site
        run: npm run build:pages
        env:
          VITE_BASE_PATH: /TraumaRecovery/

      # The same check the deploy runs, so a base-path or chunking fault shows
      # up on the pull request rather than as a blank page after merge.
      - name: Check the build is servable
        run: npm run check:pages
        env:
          VITE_BASE_PATH: /TraumaRecovery/

  test:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The tests run against a real production build served the way Pages
      # serves it, base path and 404 fallback included.
      - name: Build static site
        run: npm run build:pages
        env:
          VITE_BASE_PATH: /TraumaRecovery/

      - name: Run tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A book written from photographed clinical notes. A clinician's personal email
  # address and a private file link were found and redacted by hand during
  # transcription — hand-redaction is not a control, and nothing stops the next
  # paste. This is the control.
  #
  # `--no-git` scans the working tree rather than history on purpose. Per-push CI
  # should answer "did this change add a secret", which is a property of the tree;
  # scanning all history on every push re-asks a question whose answer cannot
  # change without a history rewrite, and would fail every build until that
  # rewrite happens rather than at the commit that caused it. The one-time
  # history audit belongs with that rewrite.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `--redact` so a finding never puts the secret itself in a public log.
      # `.gitleaks.toml` extends the default ruleset and exempts two generated
      # high-entropy files by path; it says why in the file.
      - name: Scan the working tree
        run: gitleaks detect --no-git --redact --verbose --config .gitleaks.toml

  # Its own job rather than a step after the tests. Building the ebook means
  # screenshotting 87 figures out of a real browser, which takes longer than
  # everything else here put together; run in parallel it costs no wall clock,
  # and the test result — the signal anyone is waiting on — is not stuck behind
  # it.
  epub:
    name: Kindle edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static site
        run: npm run build:pages
        env:
          VITE_BASE_PATH: /TraumaRecovery/

      # The ebook comes from the same chapter markdown and the same rendered
      # figures, so a change that breaks it breaks it here rather than at upload.
      - name: Build and preflight the EPUB
        run: |
          npm run epub
          npm run check:epub

      - uses: actions/upload-artifact@v4
        with:
          name: healing-together-epub
          path: dist/healing-together.epub
          retention-days: 14
