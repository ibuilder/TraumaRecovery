# Gitleaks configuration.
#
# Starts from the maintained default ruleset and adds only path exemptions, so
# new rules arrive with new versions rather than being frozen here.

[extend]
useDefault = true

[[allowlists]]
description = """
Two files in this repository are large high-entropy blobs by design, and a
generic-secret rule matches entropy. Exempting them by path keeps the scan
useful rather than permanently red:

  package-lock.json      — a `sha512-…` integrity hash on every one of ~460
                           packages. Secrets do not belong in a lockfile and
                           npm rewrites it wholesale, so nothing is lost.
  book-fonts-data.ts     — generated. Four Liberation Serif faces, subset and
                           base64-encoded, ~191 kB, so the exported PDF can
                           embed its own fonts. Regenerated by `npm run
                           book-fonts`; it is font outlines, not text.

Everything else is scanned, including all chapter prose and every script.
"""
paths = [
  '''package-lock\.json''',
  '''client/src/lib/book-fonts-data\.ts''',
]
